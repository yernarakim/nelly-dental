<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Прайс-лист — Nelly Dental Clinic</title>
<meta name="description" content="Цены на услуги стоматологии Nelly Dental Clinic.">
<meta property="og:title" content="Прайс-лист — Nelly Dental Clinic">
<meta name="theme-color" content="#bc939a">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23bc939a'/%3E%3Ctext x='32' y='44' font-family='Arial' font-size='34' text-anchor='middle' fill='%23e6c987'%3EN%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&display=swap">
<style>
:root{
  --band:#bc939a; --band-ink:#f7ece3; --gold:#c9a255; --gold-2:#ecd39a;
  --bg:#f7f0eb; --sheet:#fffaf6; --ink:#3a2a2e; --muted:#8a7378; --line:#ecdcd6; --accent:#9c6b74;
  --f:"Jost","Futura","Century Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root{
  --band:#6f4f56; --band-ink:#f5e9df; --gold:#d8b46b; --gold-2:#ecd49b;
  --bg:#1f1719; --sheet:#2a2023; --ink:#f2e4dc; --muted:#b59ea3; --line:#413236; --accent:#dcaab3; color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.45}
.in{max-width:760px;margin:0 auto;padding-left:max(18px,env(safe-area-inset-left));padding-right:max(18px,env(safe-area-inset-right))}
header{background:var(--band);color:var(--band-ink);padding-top:calc(env(safe-area-inset-top) + 34px);padding-bottom:30px}
.word{display:inline-block;font-weight:500;font-size:12px;line-height:1.15;letter-spacing:.08em;color:var(--gold-2);text-transform:uppercase;border-left:1.5px solid var(--gold-2);padding-left:10px;margin-bottom:22px}
h1{margin:0;font-weight:300;font-size:clamp(34px,9vw,54px);line-height:1;letter-spacing:.03em;text-transform:uppercase}
.tools{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.tools .in{display:grid;gap:10px;padding-block:12px}
.search{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--sheet);border:1px solid var(--line);border-radius:999px;padding:10px 18px;outline:none}
.search:focus{border-color:var(--gold)}
.cats{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -18px;padding:0 18px}
.cats::-webkit-scrollbar{display:none}
.cats a{flex:none;font-size:13px;letter-spacing:.04em;color:var(--accent);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:6px 14px;background:var(--sheet);white-space:nowrap}
.cats a:focus-visible,.search:focus-visible,button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
main .in{padding-block:8px 40px}
section{scroll-margin-top:120px;padding-top:26px}
h2{font-weight:400;font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);margin:0 0 4px;padding-bottom:10px;border-bottom:1px solid var(--gold)}
.row{display:flex;align-items:baseline;gap:14px;padding:12px 0;border-bottom:1px solid var(--line)}
.n{flex:1;min-width:0}
.p{white-space:nowrap;font-weight:500;font-variant-numeric:tabular-nums}
.p small{font-weight:400;color:var(--muted);font-size:13px;margin-right:3px}
.msg{padding:40px 0;color:var(--muted);text-align:center}
.msg button{margin-top:12px;font:inherit;color:var(--ink);background:var(--sheet);border:1px solid var(--line);border-radius:999px;padding:8px 18px}
.sk{height:14px;border-radius:7px;background:var(--line);margin:18px 0;opacity:.6}
footer{color:var(--muted);font-size:13px;padding-bottom:calc(env(safe-area-inset-bottom) + 32px)}
footer .in{display:grid;gap:4px;border-top:1px solid var(--line);padding-top:18px}
</style>
</head>
<body>
<header>
  <div class="in">
    <div class="word">Nelly<br>Dental<br>Clinic</div>
    <h1>Прайс-лист</h1>
  </div>
</header>

<div class="tools">
  <div class="in">
    <input class="search" id="q" type="search" placeholder="Поиск услуги" aria-label="Поиск услуги" autocomplete="off">
    <nav class="cats" id="cats" aria-label="Разделы"></nav>
  </div>
</div>

<main><div class="in" id="list">
  <div class="sk" style="width:40%"></div><div class="sk"></div><div class="sk" style="width:85%"></div><div class="sk"></div><div class="sk" style="width:70%"></div>
</div></main>

<footer><div class="in">
  <span>Цены указаны в тенге.</span>
  <span>Точную стоимость лечения врач называет после осмотра.</span>
</div></footer>

<script>
const SHEET_ID='1EuKsgCxNSbfXSSexXj6AwSK9qki86m61SFL82XTA9II';
const TAB='Прайс сайта';
// Колонки листа: A Категория, B Услуга, E Цена на сайте, F Показывать
const QUERY="select A, B, E where F = 'да' and E > 0";
const URL_CSV='https://docs.google.com/spreadsheets/d/'+SHEET_ID+'/gviz/tq?tqx=out:csv&sheet='+encodeURIComponent(TAB)+'&tq='+encodeURIComponent(QUERY);

const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>n.toLocaleString('ru-RU').replace(/[  ,]/g,' ')+' ₸';
let GROUPS=[];

function parseCSV(t){const out=[];let r=[],f='',q=false;for(let i=0;i<t.length;i++){const c=t[i];
  if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
  else if(c==='"')q=true;else if(c===','){r.push(f);f=''}else if(c==='\n'){r.push(f);out.push(r);r=[];f=''}else if(c!=='\r')f+=c}
  if(f||r.length){r.push(f);out.push(r)}return out}

function build(rows){
  const cats=new Map();
  for(const [cat,name,price] of rows){
    const p=parseInt(String(price).replace(/\D/g,''),10);
    const n=String(name||'').replace(/\s+/g,' ').trim();
    if(!n||!p)continue;
    const c=String(cat||'Прочее').trim();
    if(!cats.has(c))cats.set(c,new Map());
    const items=cats.get(c), key=n.toLowerCase();
    const it=items.get(key)||{name:n,prices:[]};it.prices.push(p);items.set(key,it);
  }
  return [...cats].map(([c,items],i)=>({id:'c'+i,cat:c,items:[...items.values()].map(it=>({name:it.name,min:Math.min(...it.prices),many:new Set(it.prices).size>1}))}));
}

function render(){
  const q=$('q').value.trim().toLowerCase();
  const groups=GROUPS.map(g=>({...g,items:q?g.items.filter(it=>it.name.toLowerCase().includes(q)):g.items})).filter(g=>g.items.length);
  $('cats').innerHTML=groups.map(g=>`<a href="#${g.id}">${esc(g.cat)}</a>`).join('');
  $('list').innerHTML=groups.length?groups.map(g=>`<section id="${g.id}"><h2>${esc(g.cat)}</h2>${
    g.items.map(it=>`<div class="row"><span class="n">${esc(it.name)}</span><span class="p">${it.many?'<small>от</small>':''}${fmt(it.min)}</span></div>`).join('')}</section>`).join('')
    :`<div class="msg">Ничего не нашлось</div>`;
}

async function load(){
  try{
    const r=await fetch(URL_CSV,{cache:'no-store'});
    if(!r.ok)throw new Error(r.status);
    const rows=parseCSV(await r.text()).slice(1);
    GROUPS=build(rows);
    if(!GROUPS.length)throw new Error('empty');
    render();
  }catch(e){
    $('cats').innerHTML='';
    $('list').innerHTML='<div class="msg">Не удалось загрузить прайс.<br><button type="button" id="retry">Попробовать ещё раз</button></div>';
    $('retry').onclick=()=>{$('list').innerHTML='<div class="sk"></div><div class="sk"></div>';load()};
  }
}
$('q').addEventListener('input',render);
load();
</script>
</body>
</html>
